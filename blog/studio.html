<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Writing Studio | Shahnaz Kulsoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0ea5e9; --primary-light: #e0f2fe; --primary-dark: #0369a1;
      --accent: #06b6d4; --accent2: #818cf8;
      --bg: #f8fafc; --bg2: #ffffff;
      --text: #0f172a; --text2: #475569; --text3: #94a3b8;
      --border: #e2e8f0; --nav-height: 68px; --content-width: 720px;
    }
    html { font-size: 16px; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP BAR ── */
    .topbar {
      height: var(--nav-height); display: flex; align-items: center;
      padding: 0 2rem; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      gap: 1.5rem; flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(14,165,233,0.06);
    }
    .topbar-brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; color: var(--primary-dark); white-space: nowrap; }
    .topbar-brand span { color: var(--text3); font-weight: 400; font-size: 0.8rem; margin-left: 6px; }
    .tab-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .tab-btn { padding: 6px 16px; font-size: 0.82rem; font-weight: 500; background: var(--bg); border: none; cursor: pointer; color: var(--text3); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .topbar-right { margin-left: auto; display: flex; gap: 0.75rem; align-items: center; }
    .status-chip { font-size: 0.75rem; padding: 3px 10px; border-radius: 100px; background: var(--bg); border: 1px solid var(--border); color: var(--text3); white-space: nowrap; }
    .status-chip.thinking { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
    .status-chip.done { background: #f0fdf4; color: #14532d; border-color: #bbf7d0; }
    .btn { padding: 7px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: var(--text3); cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--primary-dark); border: 1px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    /* ── MAIN LAYOUT ── */
    .studio { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { width: 280px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-section { padding: 1.25rem 1.25rem 0; display: flex; flex-direction: column; gap: 0.6rem; }
    .sidebar-section:last-child { padding-bottom: 1.25rem; }
    .sidebar-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
    .sidebar input, .sidebar select, .sidebar textarea {
      width: 100%; font-size: 0.82rem; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); outline: none;
      font-family: 'DM Sans', sans-serif; transition: border-color 0.15s;
    }
    .sidebar input:focus, .sidebar select:focus, .sidebar textarea:focus { border-color: var(--primary); }
    .sidebar textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    .divider { height: 1px; background: var(--border); margin: 0.5rem 0; }
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { font-size: 0.72rem; padding: 3px 10px; border-radius: 100px; border: 1px solid var(--border); color: var(--text2); cursor: pointer; background: var(--bg); user-select: none; transition: all 0.15s; }
    .tag:hover { border-color: var(--primary); color: var(--primary); }
    .tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .ai-btns { display: flex; gap: 5px; }
    .ai-btn { flex: 1; font-size: 0.72rem; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer; text-align: center; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .ai-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    #ai-status { font-size: 0.72rem; color: var(--text3); min-height: 16px; }

    /* ── EDITOR AREA ── */
    .editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .pane { flex: 1; overflow: hidden; display: none; flex-direction: column; }
    .pane.active { display: flex; }

    /* Write pane */
    .write-wrap { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
    .write-field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
    .write-field input, .write-field textarea {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg2); color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; outline: none; transition: border-color 0.15s;
    }
    .write-field input:focus, .write-field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,0.08); }
    #post-title { font-size: 1.2rem; font-weight: 600; font-family: 'Syne', sans-serif; }
    #post-body { min-height: 380px; line-height: 1.8; font-size: 0.93rem; resize: none; flex: 1; }
    .write-meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .word-count { font-size: 0.75rem; color: var(--text3); text-align: right; }

    /* Preview pane */
    #preview-frame { flex: 1; border: none; width: 100%; background: #fff; }

    /* Code pane */
    .code-toolbar { padding: 0.75rem 1.5rem; background: #0f172a; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .code-toolbar span { font-size: 0.75rem; color: #94a3b8; font-family: monospace; }
    .copy-code-btn { font-size: 0.75rem; padding: 4px 12px; border-radius: 6px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .copy-code-btn:hover { border-color: var(--primary); color: var(--primary); }
    #code-output { flex: 1; background: #0f172a; color: #e2e8f0; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 0.8rem; line-height: 1.7; padding: 1.5rem; border: none; resize: none; outline: none; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--text); color: #fff; padding: 0.75rem 1.25rem; border-radius: 10px; font-size: 0.85rem; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ── POST PREVIEW STYLES (injected into iframe) ── */
  </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-brand">Blog Writing Studio <span>blog/studio.html</span></div>
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('write',this)">✍️ Write</button>
    <button class="tab-btn" onclick="switchTab('preview',this)">👁 Preview</button>
    <button class="tab-btn" onclick="switchTab('code',this)">{ } Code</button>
  </div>
  <div class="topbar-right">
    <span class="status-chip" id="status-chip">ready</span>
    <button class="btn btn-outline" id="copy-obj-btn" onclick="copyPostObject()" disabled>Copy post object</button>
    <button class="btn btn-ghost" id="copy-code-topbtn" onclick="copyGeneratedCode()" style="display:none">Copy HTML</button>
    <a class="btn btn-ghost" href="index.html">← Back to Blog</a>
  </div>
</header>

<div class="studio">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">Category</div>
      <div class="tag-wrap" id="cat-tags">
        <span class="tag active" data-cat=".NET">.NET</span>
        <span class="tag" data-cat="Azure">Azure</span>
        <span class="tag" data-cat="Architecture">Architecture</span>
        <span class="tag" data-cat="C#">C#</span>
        <span class="tag" data-cat="DevOps">DevOps</span>
        <span class="tag" data-cat="SQL">SQL</span>
        <span class="tag" data-cat="Performance">Performance</span>
      </div>
      <input id="custom-cat" placeholder="or type custom category…" />
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="sidebar-label">Date</div>
      <input id="meta-date" value="May 2026" />
      <div class="sidebar-label">Read time</div>
      <input id="meta-readtime" value="5 min read" />
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">
      <div class="sidebar-label">✦ AI Assist</div>
      <textarea id="ai-prompt" placeholder="Describe the post topic… e.g. 'Minimal APIs in .NET 8 vs Controllers, with performance benchmarks and code examples'"></textarea>
      <div class="ai-btns">
        <button class="ai-btn" onclick="aiAction('draft')">📝 Draft</button>
        <button class="ai-btn" onclick="aiAction('expand')">📈 Expand</button>
        <button class="ai-btn" onclick="aiAction('polish')">✨ Polish</button>
      </div>
      <div id="ai-status"></div>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section" style="padding-bottom:1.25rem;">
      <button class="btn btn-primary" onclick="buildPost()" style="width:100%; padding:10px; font-size:0.88rem;">⚙️ Generate preview + code</button>
    </div>

  </aside>

  <!-- EDITOR AREA -->
  <div class="editor-area">

    <!-- WRITE -->
    <div class="pane active" id="pane-write">
      <div class="write-wrap">
        <div class="write-field">
          <label>Title</label>
          <input id="post-title" placeholder="Why I Switched from .NET 6 to .NET 8 and Never Looked Back" oninput="updateCount()" />
        </div>
        <div class="write-field">
          <label>Subtitle <span style="font-weight:400;text-transform:none;letter-spacing:0;">(shown under title inside the post)</span></label>
          <input id="post-subtitle" placeholder="Real numbers, real projects — here's what actually changed." />
        </div>
        <div class="write-field">
          <label>Excerpt <span style="font-weight:400;text-transform:none;letter-spacing:0;">(shown on the listing card)</span></label>
          <input id="post-excerpt" placeholder="Short description shown on the card grid…" />
        </div>
        <div class="write-field" style="flex:1; display:flex; flex-direction:column;">
          <label>Content <span style="font-weight:400;text-transform:none;letter-spacing:0;">— HTML or plain text. AI will format it.</span></label>
          <textarea id="post-body" oninput="updateCount()" placeholder="Start writing here, or use AI Assist on the left.

Supported tags:
  <h2>Section heading</h2>
  <h3>Sub-section</h3>
  <p>Paragraph</p>
  <pre><code class=&quot;language-csharp&quot;>code here</code></pre>
  <ul><li>item</li></ul>
  <blockquote>callout quote</blockquote>
  <div class=&quot;callout callout-tip&quot;><span class=&quot;callout-icon&quot;>💡</span><span>Tip text</span></div>
  <hr>"></textarea>
        </div>
        <div class="word-count" id="word-count">0 words</div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="pane" id="pane-preview">
      <iframe id="preview-frame" title="Post preview"></iframe>
    </div>

    <!-- CODE -->
    <div class="pane" id="pane-code">
      <div class="code-toolbar">
        <span id="code-filename">post-slug.html (standalone) · paste body into index.html POSTS array to publish</span>
        <button class="copy-code-btn" onclick="copyGeneratedCode()">Copy code</button>
      </div>
      <textarea id="code-output" spellcheck="false" readonly placeholder="Click 'Generate preview + code' to build the output…"></textarea>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── STATE ──────────────────────────────────────────────
  let activeCategory = '.NET';
  let generatedHTML  = '';
  let postObjectStr  = '';

  // ── CATEGORY TAGS ─────────────────────────────────────
  document.querySelectorAll('.tag[data-cat]').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tag[data-cat]').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeCategory = t.dataset.cat;
      document.getElementById('custom-cat').value = '';
    });
  });
  document.getElementById('custom-cat').addEventListener('input', e => {
    if (e.target.value.trim()) {
      document.querySelectorAll('.tag[data-cat]').forEach(x => x.classList.remove('active'));
      activeCategory = e.target.value.trim();
    }
  });

  // ── TABS ──────────────────────────────────────────────
  function switchTab(id, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    document.getElementById('pane-' + id).classList.add('active');
    const codeTopBtn = document.getElementById('copy-code-topbtn');
    codeTopBtn.style.display = (id === 'code' && generatedHTML) ? 'inline-flex' : 'none';
    if (id === 'preview' && generatedHTML) {
      document.getElementById('preview-frame').srcdoc = generatedHTML;
    }
  }

  // ── WORD COUNT ────────────────────────────────────────
  function updateCount() {
    const text = (document.getElementById('post-title').value + ' ' + document.getElementById('post-body').value).trim();
    const n = text ? text.split(/\s+/).length : 0;
    document.getElementById('word-count').textContent = n.toLocaleString() + ' words';
  }

  // ── STATUS ────────────────────────────────────────────
  function setStatus(label, type) {
    const el = document.getElementById('status-chip');
    el.textContent = label;
    el.className = 'status-chip' + (type ? ' ' + type : '');
  }

  // ── TOAST ─────────────────────────────────────────────
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── SLUG ──────────────────────────────────────────────
  function makeSlug(title) {
    return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'my-post';
  }

  // ── AI ASSIST ─────────────────────────────────────────
  async function aiAction(action) {
    const prompt   = document.getElementById('ai-prompt').value.trim();
    const title    = document.getElementById('post-title').value.trim();
    const body     = document.getElementById('post-body').value.trim();
    const statusEl = document.getElementById('ai-status');

    const system = `You are a technical blog writing assistant for Shahnaz Kulsoom, a senior full-stack .NET developer.
Write clear, practical, developer-focused content. Use HTML tags: <h2>, <h3>, <p>, <pre><code class="language-csharp">, <ul><li>, <blockquote>.
For callouts use: <div class="callout callout-tip"><span class="callout-icon">💡</span><span>text</span></div>
Use callout-info for info, callout-warn for warnings, callout-tip for tips.
Return ONLY the HTML body content — no wrapping page HTML, no markdown fences.`;

    let userMsg = '';
    if (action === 'draft') {
      userMsg = `Write a complete, detailed blog post in HTML about: ${prompt || 'a .NET development topic'}.
Respond in this exact format:
TITLE: (post title)
SUBTITLE: (one compelling sentence)
EXCERPT: (2-sentence card description)
BODY:
(full HTML content with h2, p, pre/code, callouts)`;
    } else if (action === 'expand') {
      userMsg = `Expand this blog post with more depth, code examples, and practical insights. Return the improved HTML body only:\n\nTitle: ${title}\n\n${body || prompt}`;
    } else {
      userMsg = `Polish this blog post: improve clarity, fix grammar, strengthen the writing. Return the improved HTML body only:\n\nTitle: ${title}\n\n${body || prompt}`;
    }

    setStatus('AI writing…', 'thinking');
    statusEl.textContent = 'Generating…';
    document.querySelectorAll('.ai-btn').forEach(b => b.disabled = true);

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system,
          messages: [{ role: 'user', content: userMsg }]
        })
      });
      const data = await res.json();
      const reply = data.content?.find(b => b.type === 'text')?.text || '';

      if (action === 'draft') {
        const titleM    = reply.match(/^TITLE:\s*(.+)$/m);
        const subtitleM = reply.match(/^SUBTITLE:\s*(.+)$/m);
        const excerptM  = reply.match(/^EXCERPT:\s*([\s\S]+?)(?=^BODY:|$)/m);
        const bodyM     = reply.match(/^BODY:\s*([\s\S]+)/m);
        if (titleM)    document.getElementById('post-title').value    = titleM[1].trim();
        if (subtitleM) document.getElementById('post-subtitle').value = subtitleM[1].trim();
        if (excerptM)  document.getElementById('post-excerpt').value  = excerptM[1].trim();
        if (bodyM)     document.getElementById('post-body').value     = bodyM[1].trim();
        else           document.getElementById('post-body').value     = reply;
      } else {
        document.getElementById('post-body').value = reply;
      }
      updateCount();
      setStatus('done ✓', 'done');
      statusEl.textContent = 'Done! Review and tweak, then generate.';
      setTimeout(() => { statusEl.textContent = ''; setStatus('ready', ''); }, 4000);
    } catch(e) {
      setStatus('error', '');
      statusEl.textContent = 'Request failed — check console.';
      console.error(e);
    } finally {
      document.querySelectorAll('.ai-btn').forEach(b => b.disabled = false);
    }
  }

  // ── BUILD POST ────────────────────────────────────────
  function buildPost() {
    const title    = document.getElementById('post-title').value.trim()    || 'Untitled Post';
    const subtitle = document.getElementById('post-subtitle').value.trim() || '';
    const excerpt  = document.getElementById('post-excerpt').value.trim()  || subtitle;
    const body     = document.getElementById('post-body').value.trim();
    const date     = document.getElementById('meta-date').value.trim()     || 'May 2026';
    const readTime = document.getElementById('meta-readtime').value.trim() || '5 min read';
    const cat      = activeCategory;
    const slug     = makeSlug(title);

    // Convert plain text to paragraphs if no HTML tags present
    const content = body.includes('<')
      ? body
      : body.split(/\n\n+/).map(p => p.trim() ? `<p>${p.replace(/\n/g,' ')}</p>` : '').join('\n    ');

    // ── Post object string (for pasting into index.html) ──
    const bodyEscaped = content.replace(/`/g, '\\`').replace(/\${/g, '\\${');
    postObjectStr = `  {
    slug:     "${slug}",
    title:    "${title.replace(/"/g,'\\"')}",
    category: "${cat}",
    date:     "${date}",
    readTime: "${readTime}",
    excerpt:  "${excerpt.replace(/"/g,'\\"')}",
    subtitle: "${subtitle.replace(/"/g,'\\"')}",
    body: \`
      ${bodyEscaped}
    \`
  },`;

    // ── Standalone HTML file ──
    generatedHTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} | Shahnaz Kulsoom</title>
  <meta name="description" content="${excerpt}">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary:#0ea5e9; --primary-light:#e0f2fe; --primary-dark:#0369a1; --accent:#06b6d4; --accent2:#818cf8; --bg:#f8fafc; --bg2:#ffffff; --text:#0f172a; --text2:#475569; --text3:#94a3b8; --border:#e2e8f0; --nav-height:68px; --content-width:720px; }
    html { scroll-behavior:smooth; font-size:16px; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; overflow-x:hidden; }
    .navbar { position:fixed; top:0; left:0; right:0; z-index:100; height:var(--nav-height); display:flex; align-items:center; padding:0 2.5rem; background:rgba(248,250,252,0.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); box-shadow:0 4px 24px rgba(14,165,233,0.06); }
    .nav-inner { max-width:1100px; width:100%; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .nav-brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.2rem; color:var(--primary-dark); text-decoration:none; letter-spacing:-0.02em; }
    .nav-links { display:flex; gap:2rem; list-style:none; }
    .nav-links a { font-size:0.9rem; font-weight:500; color:var(--text2); text-decoration:none; position:relative; transition:color 0.2s; }
    .nav-links a::after { content:''; position:absolute; bottom:-3px; left:0; width:0; height:2px; background:var(--primary); border-radius:2px; transition:width 0.3s; }
    .nav-links a:hover { color:var(--primary); }
    .nav-links a:hover::after { width:100%; }
    .nav-links .nav-blog a { background:var(--primary); color:#fff; padding:6px 16px; border-radius:100px; font-size:0.85rem; }
    .nav-links .nav-blog a::after { display:none; }
    .nav-links .nav-blog a:hover { background:var(--primary-dark); }
    #read-progress { position:fixed; top:var(--nav-height); left:0; height:3px; width:0%; background:linear-gradient(90deg,var(--primary),var(--accent2)); z-index:200; transition:width 0.1s linear; }
    .post-hero { padding:calc(var(--nav-height) + 4rem) 2.5rem 3.5rem; background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 40%,#f8fafc 100%); position:relative; overflow:hidden; }

  function copyPostObject() {
    if (!postObjectStr) return;
    navigator.clipboard.writeText(postObjectStr).then(() => {
      toast('✓ Post object copied! Paste it inside the POSTS array in blog/index.html');
    });
  }

  // ── COPY GENERATED HTML ──────────────────────────────
  function copyGeneratedCode() {

    navigator.clipboard.writeText(generatedHTML).then(() => toast('✓ HTML copied!'));
  }
